<!DOCTYPE html>
<html data-theme="{{ 'dark' if settings.dark_mode else 'light' }}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README — {{ settings.dashboard_name }}</title>
    <style>
        /* Instrument-panel token palette -- same tokens/values as
           dashboard.html/setup.html, a pure swap-in here (every color
           reference in this file already goes through one of these
           names, confirmed by grepping for stray hex/rgba before doing
           this -- see CLAUDE.md's setup.html reskin gotcha for why that
           check matters). --amber is kept as an alias to --caution for
           the same reason setup.html's old --amber was -- unused in this
           file's body today, but harmless to keep for anyone extending it. */
        :root {
            --bg: #12151a; --card-bg: #1a1e25; --card-border: #2b313b;
            --text: #eef0f2; --text-muted: #9aa2ad; --text-dim: #5b6470;
            --accent: #ffb648; --link: #4fd8c4; --amber: #f0c419;
        }
        [data-theme="light"] {
            --bg: #eef1f4; --card-bg: #ffffff; --card-border: #dde2e8;
            --text: #1b1f26; --text-muted: #5b6470; --text-dim: #98a1ab;
            --accent: #c97a12; --link: #0e8f7d; --amber: #a8720a;
        }
        * { box-sizing: border-box; }
        html {
            scrollbar-width: thin; scrollbar-color: var(--card-border) transparent;
        }
        html::-webkit-scrollbar { width: 10px; }
        html::-webkit-scrollbar-track { background: transparent; }
        html::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 5px; }
        html::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
        body { background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               font-size: 14px; padding: 20px; max-width: 860px; margin: 0 auto; }
        a.back-link { color: var(--link); text-decoration: none; font-size: 13px; }
        a.back-link:hover { text-decoration: underline; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border);
                border-radius: 8px; padding: 24px; margin-top: 14px; }

        /* Rendered markdown styling */
        #readme-content h1 { font-size: 22px; margin: 0 0 16px; padding-bottom: 10px;
                              border-bottom: 1px solid var(--card-border); }
        #readme-content h2 { font-size: 18px; margin: 28px 0 12px; padding-bottom: 8px;
                              border-bottom: 1px solid var(--card-border); }
        #readme-content h3 { font-size: 15px; margin: 20px 0 8px; color: var(--accent); }
        #readme-content p  { margin: 0 0 12px; line-height: 1.6; }
        #readme-content ul, #readme-content ol { margin: 0 0 12px 22px; line-height: 1.6; }
        #readme-content li { margin-bottom: 4px; }
        #readme-content a  { color: var(--link); }
        #readme-content code { background: var(--bg); border-radius: 3px; padding: 1px 5px;
                                font-size: 12.5px; }
        #readme-content pre { background: var(--bg); border-radius: 6px; padding: 12px;
                               overflow-x: auto; margin: 0 0 14px; }
        #readme-content pre code { background: none; padding: 0; }
        #readme-content blockquote { border-left: 3px solid var(--card-border); margin: 0 0 12px;
                                      padding: 2px 14px; color: var(--text-muted); }
        #readme-content table { border-collapse: collapse; margin: 0 0 14px; width: 100%; font-size: 13px; }
        #readme-content th, #readme-content td { border: 1px solid var(--card-border); padding: 6px 10px; text-align: left; }
        #readme-content th { background: var(--bg); }
        #readme-content hr { border: none; border-top: 1px solid var(--card-border); margin: 20px 0; }
        #readme-content img { max-width: 100%; }
    </style>
</head>
<body>
    {% if not embed %}
    <a class="back-link" href="/version">← Back to Version info</a>
    {% endif %}
    <div class="card">
        <div id="readme-content">Loading…</div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    const readmeSource = {{ readme_text | tojson }};
    const target = document.getElementById('readme-content');
    if (typeof marked !== 'undefined') {
        target.innerHTML = marked.parse(readmeSource);
    } else {
        // Marked failed to load (network block, offline, etc.) -- fall back
        // to plain preformatted text rather than showing nothing.
        const pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.textContent = readmeSource;
        target.innerHTML = '';
        target.appendChild(pre);
    }
</script>
<script>
/* Reached from the Pocket Dash mobile app (?m=1): point "back" links at
   /mobile, and carry the flag on links between these sub-pages.
   Session-scoped so a dropped query string still remembers. */
(function () {
    var fromMobile = new URLSearchParams(location.search).get('m') === '1';
    try {
        if (fromMobile) sessionStorage.setItem('pd-from-mobile', '1');
        else fromMobile = sessionStorage.getItem('pd-from-mobile') === '1';
    } catch (e) {}
    if (!fromMobile) return;
    document.querySelectorAll('a[href]').forEach(function (a) {
        var h = a.getAttribute('href');
        if (h === '/') {
            a.setAttribute('href', '/mobile');
            a.textContent = a.textContent.replace(/dashboard/i, 'Pocket Dash');
        } else if (/^\/(setup|version|readme)(\?|$)/.test(h) && h.indexOf('m=1') === -1) {
            a.setAttribute('href', h + (h.indexOf('?') === -1 ? '?' : '&') + 'm=1');
        }
    });
})();
</script>
</body>
</html>
